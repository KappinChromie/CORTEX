[package]
name = "cortex-adapters"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-model = { path = "../cortex-model" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
walkdir = "2.5"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tracing = "0.1"
dirs = "5.0"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.10"
