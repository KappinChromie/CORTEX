[package]
name = "cortex-store"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-model = { path = "../cortex-model" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
