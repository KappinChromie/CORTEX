[package]
name = "cortex-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
cortex-model = { path = "../crates/cortex-model" }
cortex-adapters = { path = "../crates/cortex-adapters" }
cortex-store = { path = "../crates/cortex-store" }
cortex-graph = { path = "../crates/cortex-graph" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
